name: OpenPro Automated Release & APK Publishing

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_publish_apk:
    name: Build Release APK & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Static Analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Execute Automated Test Suite
        run: flutter test --no-pub

      - name: Build Release APK
        run: flutter build apk --release

      - name: Publish GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
